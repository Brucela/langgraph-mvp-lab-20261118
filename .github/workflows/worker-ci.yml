name: Worker CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mvp_test
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: mvp_test
        options: >-
          --health-cmd "pg_isready -U mvp_test -d mvp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "127.0.0.1:5433:5432"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --python 3.12
      - name: Run worker and PostgreSQL integration tests
        env:
          MVP_TEST_DATABASE_URL: postgresql://mvp_test:ci-local-only@127.0.0.1:5433/mvp_test
          MVP_TEST_POSTGRES_DSN: postgresql://mvp_test:ci-local-only@127.0.0.1:5433/mvp_test
        run: .venv/bin/python -m pytest -q -rs tests
