name: Issue intake
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  capture:
    if: github.event.label.name == 'ai-ready' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Save the GitHub event
        run: cp "$GITHUB_EVENT_PATH" issue-event.json
      - uses: actions/upload-artifact@v6
        with:
          name: issue-event
          path: issue-event.json
          retention-days: 7
