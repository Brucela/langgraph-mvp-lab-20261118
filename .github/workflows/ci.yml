name: PR CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: calculator-tests
    runs-on: ubuntu-latest
    env:
      MVP_REQUIRE_DISCOUNT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run calculator test suite
        run: python3 -m unittest discover -s demo -v
